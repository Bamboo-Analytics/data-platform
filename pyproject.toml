[project]
name = "data-platform"
version = "0.1.0"
description = "Financial data platform for collecting and analyzing fundamental features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "yfinance>=0.2.40",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "lxml>=4.9.0",
]

[tool.uv]
package=true

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]
