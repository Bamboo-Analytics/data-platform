[project]
name = "data-platform"
version = "0.1.0"
description = "Cross-asset data ingestion pipeline for ClickHouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Data sources
    "yfinance>=0.2.0",
    "investpy>=1.0.8",
    
    # Database
    "clickhouse-connect>=0.6.0",
    
    # Configuration and validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    
    # Data validation
    "pandera>=0.17.0",
    
    # Retry logic
    "tenacity>=8.2.0",
    
    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",
    
    # Logging
    "python-json-logger>=2.0.0",
    
    # Environment variables
    "python-dotenv>=1.0.0",
    
    # Notebook support
    "ipykernel>=7.1.0",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=2.7.0",
]

[project.scripts]
data-platform = "data_platform.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
